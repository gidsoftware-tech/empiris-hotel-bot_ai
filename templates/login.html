<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Empiris Guest House</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --accent: #b91c1c; --accent-dark: #991b1b; --ink: #1f2933; --muted: #6b7280; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink); }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%); padding: 24px;
  }
  .card { background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 25px 80px rgba(0,0,0,.35); }
  .brand { font-family: 'Playfair Display', serif; font-size: 1.75rem; font-weight: 700; text-align: center; color: var(--accent); margin-bottom: 8px; }
  .sub { text-align: center; color: var(--muted); margin-bottom: 28px; font-size: .95rem; }
  .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: .95rem; }
  .alert-error { background: #fef2f2; color: var(--accent); border: 1px solid #fecaca; }
  .form-group { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: .9rem; font-weight: 600; color: var(--ink); }
  .form-group input { padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 10px; font-size: .95rem; background: #fff; }
  .form-group input:focus { outline: none; border-color: var(--accent); }
  .btn { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all .2s; }
  .btn:hover { background: var(--accent-dark); }
  .hint { margin-top: 20px; font-size: .85rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Empiris Guest House</div>
    <div class="sub">Narok County, Kenya · Staff Dashboard</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('do_login') }}">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required placeholder="e.g. admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <div class="hint">Demo: admin / admin123 · guest / guest123</div>
  </div>
</body>
</html>
